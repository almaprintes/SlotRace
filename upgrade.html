<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Actualizar SlotRace</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(160deg,#071b25,#142935);color:#edfffc;padding:20px}
main{max-width:440px;width:100%;padding:25px;background:#112935;border:1px solid #456d75;border-radius:22px;box-shadow:0 18px 55px #0006}
h1{margin:0 0 10px;font-size:26px}p{color:#c3d8dc;line-height:1.5}
button,a{display:block;width:100%;box-sizing:border-box;padding:13px 16px;margin-top:14px;border-radius:13px;border:1px solid #85e9d5;background:#42d8bd;color:#07302c;text-align:center;text-decoration:none;font-weight:850;font-size:16px}
small{display:block;color:#9bb7bf;margin-top:15px;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>Actualizar SlotRace</h1>
<p id="status">Comprobando la versión disponible…</p>
<a id="updateLink" href="./index.html?v=0.15.7&fresh=manual">Abrir versión actualizada</a>
<button id="retry" type="button">Comprobar de nuevo</button>
<small>Este acceso no borra circuitos ni récords. No elimines la PWA ni los datos del sitio para actualizarla. Si abres esta página fuera de la PWA, Safari puede usar un almacenamiento distinto.</small>
</main>
<script>
(async()=>{
 const status=document.getElementById("status"),link=document.getElementById("updateLink");
 async function refresh(){
  const nonce=Date.now();
  try{
   const response=await fetch("./version.json?fresh="+nonce,{cache:"no-store"});
   if(!response.ok)throw Error("HTTP "+response.status);
   const data=await response.json();
   if(!/^\d+\.\d+\.\d+$/.test(data.version))throw Error("Formato inválido");
   link.href="./index.html?v="+encodeURIComponent(data.version)+"&refresh="+nonce;
   status.textContent="Versión disponible: DEV "+data.version+". Usa el botón para abrirla con una dirección nueva.";
  }catch(_error){
   link.href="./index.html?v=0.15.7&refresh="+nonce;
   status.textContent="No se pudo comprobar la última versión. Puedes intentar abrirla directamente.";
  }
 }
 document.getElementById("retry").addEventListener("click",refresh);
 await refresh();
})();
</script>
</body>
</html>
