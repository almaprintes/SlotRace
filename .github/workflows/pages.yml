name: SlotRace · publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slotrace-github-pages
  cancel-in-progress: true

jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar SlotRace
        uses: actions/checkout@v4

      - name: Comprobar prototipo
        run: node smoke.cjs

      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar SlotRace
        id: deployment
        uses: actions/deploy-pages@v4
