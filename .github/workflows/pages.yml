name: SlotRace · pruebas automáticas

# GitHub Pages ya dispone de su propia compilación y despliegue desde main.
# Este flujo se limita a verificar el juego, evitando dos despliegues simultáneos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slotrace-pruebas
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar SlotRace
        uses: actions/checkout@v4

      - name: Comprobar geometría y prototipo
        run: node smoke.cjs

      - name: Comprobar control táctil analógico
        run: node tests/analog-trigger.cjs

      - name: Comprobar paso inferior y superior del puente
        run: node tests/bridge-occlusion.cjs

      - name: Comprobar Rayos X con la receta real Doble ovalo
        run: node tests/xray.cjs

      - name: Comprobar derrape, trompo y penalización
        run: node tests/drift-spin.cjs

      - name: Comprobar curvas elevadas, transiciones y cruces
        run: node tests/elevated-curves.cjs

      - name: Comprobar entrada realista en curvas del óvalo
        run: node tests/oval-curve-entry.cjs

      - name: Comprobar mesa-puzzle táctil y piezas independientes
        run: node tests/puzzle-table.cjs

      - name: Comprobar caja de corcho y extracción de inventario
        run: node tests/foam-case.cjs

      - name: Comprobar giro horario y antihorario mediante botones
        run: node tests/twist-rotation.cjs

      - name: Comprobar geometría PT-Precision y cierres exactos
        run: node tests/pt-precision.cjs

      - name: Comprobar proporcionalidad modular y diagnosticar huecos
        run: node tests/modular-closure.cjs

      - name: Comprobar cierre real por ambos extremos con hueco de 175 mm
        run: node tests/two-end-closure.cjs

      - name: Comprobar plantilla de referencia, transparencia, escala, guardado y PNG
        run: node tests/reference-template.cjs

      - name: Comprobar menú completo, conducción reversible y PNG con receta
        run: node tests/game-shell.cjs

      - name: Comprobar PT82 y choques simultáneos entre coches
        run: node tests/pt82.cjs
      - name: Comprobar Carril A interior en meta y Carril B exterior
        run: node tests/lane-names.cjs
      - name: Probar cierre flexible de hasta diez milímetros
        run: node tests/closure-flex.cjs

      - name: Verificar archivos que sirve GitHub Pages
        run: |
          test -s index.html
          test -s src/app.mjs
          test -s src/track.mjs
          test -s src/blueprint.mjs
          test -s src/site.css
          test -s assets/cars/avenir_gripline.webp
          test -s assets/cars/avenir_gripline_threequarter.webp
          test -s assets/cars/helix_spark.webp
          test -s assets/cars/helix_spark_threequarter.webp
          test -s assets/ui/slotrace-duelo-curva.avif
