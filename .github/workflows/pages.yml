name: SlotRace · publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slotrace-github-pages
  cancel-in-progress: true

jobs:
  verificar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar SlotRace
        uses: actions/checkout@v4

      - name: Comprobar geometría y prototipo
        run: node smoke.cjs

      - name: Comprobar control táctil analógico
        run: node tests/analog-trigger.cjs

      - name: Comprobar paso inferior y superior del puente
        run: node tests/bridge-occlusion.cjs

      - name: Comprobar derrape, trompo y penalización
        run: node tests/drift-spin.cjs

      - name: Comprobar entrada realista en curvas del óvalo
        run: node tests/oval-curve-entry.cjs

      - name: Comprobar mesa-puzzle táctil y piezas independientes
        run: node tests/puzzle-table.cjs

      - name: Preparar sitio estático
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R src _site/src
          touch _site/.nojekyll
          test -f _site/src/app.mjs
          test -f _site/src/track.mjs
          test -f _site/src/site.css

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publicar SlotRace
        id: deployment
        uses: actions/deploy-pages@v4
