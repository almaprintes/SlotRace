name: SlotRace referee laboratory

on:
  push:
    branches:
      - feat/server-referee-v1-20261113
      - feat/shared-physics-v4-20261113
      - feat/ai-shared-physics-fixtures-20261113
  pull_request:
    paths:
      - 'server/**'
      - 'src/physics-v4.mjs'
      - 'src/competition-protocol.mjs'
      - 'tests/referee-core.cjs'
      - 'tests/shared-physics-v4.cjs'
      - 'tests/shared-app-physics-contract.cjs'
      - 'src/app.mjs'
      - '.github/workflows/referee-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  referee:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate source
        run: |
          node --check server/referee-core.mjs
          node --check server/physics-engine.mjs
          node --check server/track-identity.mjs
          node --check src/physics-v4.mjs
          node --check src/app.mjs
          node --check tests/referee-core.cjs
      - name: Competition protocol
        run: node tests/competition-protocol.cjs
      - name: Referee deterministic unit tests
        run: node tests/referee-core.cjs
      - name: Shared SlotRace physics + real geometry
        run: |
          node tests/shared-physics-v4.cjs
          node tests/shared-app-physics-contract.cjs
      - name: AI shares physical runtime on the PT82
        run: node tests/ai-pt82.cjs
      - name: Diagnose historic complex circuits
        run: node tests/complex-circuits-diagnostics.cjs
      - name: Existing timing tests
        run: |
          node tests/event-timing.cjs
          node tests/timing-lab.cjs
