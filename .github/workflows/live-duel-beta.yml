name: SlotRace · beta multijugador y recompensas

on:
  push:
    branches: [main, feat/ingame-live-beta-0.15.71]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  beta-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxis de los dos clientes
        run: |
          node --check src/app.mjs
          node --check src/live-duel.mjs
          node --check src/live-duel-core.mjs
      - name: Verificar el acceso dentro de Competir
        run: node tests/ingame-live.cjs
      - name: Validar préstamo temporal de pistas sin propiedad de piezas
        run: node tests/live-track-loan.cjs
      - name: Verificar retorno de la pista prestada y carrera integrada
        run: node tests/real-online-pista.cjs
      - name: Verificar ovalo, carriles y vuelta local
        run: node tests/live-duel.cjs
      - name: Comprobar interpolación de rival online sin más tráfico
        run: node tests/online-rival-motion.cjs
      - name: Verificar menu multijugador dentro del juego
        run: node tests/live-duel-ingame.cjs
      - name: Probar CR, nicks y casos sin recompensa
        run: node tests/trial-rewards.cjs
      - name: Comparativa y cronometro de dos mangas
        run: node tests/duel-results.cjs
      - name: Comprobar geometria de la PT82 sin regresiones
        run: node tests/pt82.cjs
