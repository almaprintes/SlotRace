name: SlotRace · IA y PT82

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slotrace-ia-pt82
  cancel-in-progress: true

jobs:
  revisar-ia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar SlotRace
        uses: actions/checkout@v4
      - name: Verificar geometría PT82 y recuperación
        run: node tests/pt82.cjs
      - name: Verificar IA, animación y sentido horario y antihorario
        run: node tests/ai-pt82.cjs
      - name: Validar niveles de IA, anticipación, límites de agarre y selector
        run: node tests/ai-difficulty.cjs
      - name: Validar contactos leves, moderados, fuertes y paso libre
        run: node tests/rear-contact.cjs
      - name: Validar impactos en el motor real y adelantamiento tras salida
        run: node tests/rear-impact-runtime.cjs
      - name: Calcular cierres con piezas propias y presupuesto
        run: node tests/closure-guide.cjs
      - name: Comprobar cierre flexible 0,4 mm en OchoA
        run: node tests/flex-close.cjs
      - name: Comparar tiempos y declarar ganador de dos mangas
        run: node tests/duel-results.cjs
